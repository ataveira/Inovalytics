[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inovalytics"
version = "0.1.0"
description = "Plataforma on-premise de visão computacional (anotação, treino, exportação e deploy)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.30",
    "boto3>=1.35",
]
# A licença do projeto é uma decisão pendente (ver docs/spec.md); não declarar aqui.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "pyyaml>=6",
    "types-PyYAML>=6",
    "packaging>=24",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "backend/src"
files = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q -m \"not docker\""
markers = ["docker: exige Docker; pulado se ausente (make compose-smoke)"]
