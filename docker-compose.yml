# Inovalytics: PostgreSQL + armazenamento S3 (SeaweedFS) + API.
# Segredos vêm do .env (ver .env.example). Só a API é publicada no host.
name: inovalytics

services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inovalytics}
      POSTGRES_DB: ${POSTGRES_DB:-inovalytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    volumes:
      - storage_data:/data
    healthcheck:
      # 9333: master; 8333: gateway S3. Sem credenciais o S3 responde 403, o que também prova que
      # o gateway está de pé (qualquer resposta HTTP serve), por isso o grep em "HTTP/".
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:9333/cluster/status &&
          wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: inovalytics-api:0.1.0
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-inovalytics}
      POSTGRES_DB: ${POSTGRES_DB:-inovalytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      S3_ENDPOINT_URL: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
      S3_BUCKET: ${S3_BUCKET:-inovalytics}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
  storage_data:
