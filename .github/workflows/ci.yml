name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: frontend
      - name: Gate de qualidade
        run: make check

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decidir se o smoke deve rodar
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          run=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run=true
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ]; then
            run=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -E '^(docker-compose\.yml|docker/|\.env\.example$|backend/src/)' > /dev/null; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "smoke: $run"
      - uses: actions/setup-python@v6
        if: steps.filter.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependências Python
        if: steps.filter.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Smoke do Compose
        if: steps.filter.outputs.run == 'true'
        run: make compose-smoke
