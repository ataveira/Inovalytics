name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: gate (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: frontend
      - name: Gate de qualidade
        run: make check

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decidir se o smoke deve rodar
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          run=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run=true
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "refs/heads/main" ]; then
            run=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -E '^(docker-compose\.yml|docker/|\.env\.example$|backend/src/|pyproject\.toml$|backend/tests/test_compose_smoke\.py$)' > /dev/null; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "smoke: $run"
      - uses: actions/setup-python@v6
        if: steps.filter.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependências Python
        if: steps.filter.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Smoke do Compose
        if: steps.filter.outputs.run == 'true'
        env:
          PYTEST_ADDOPTS: --junitxml=smoke.xml
        run: make compose-smoke
      - name: Publicar JUnit do smoke
        if: always() && steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: smoke-junit
          path: smoke.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Diagnóstico do smoke (só em falha)
        if: failure() && steps.filter.outputs.run == 'true'
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          if not os.path.exists("smoke.xml"):
              print("::warning::smoke.xml ausente (o smoke falhou antes do pytest ou o pytest não iniciou)")
          else:
              try:
                  root = ET.parse("smoke.xml").getroot()
              except ET.ParseError as exc:
                  print("::warning::smoke.xml ilegível (XML truncado): " + str(exc))
              else:
                  for case in root.iter("testcase"):
                      for f in list(case.iter("failure")) + list(case.iter("error")):
                          text = (f.get("message") or "") + "\n" + (f.text or "")
                          lines = [x for x in text.splitlines() if x.strip()][-25:]
                          print("::error::" + case.get("name", "?") + " | " + " ⏎ ".join(lines)[:3500].replace("%", "%25"))
          PY
